name: Sync Upstream Releases

on:
  workflow_dispatch: # 允许你在网页上点击按钮一键手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Copy Releases from Upstream
        uses: pyTooling/actions-copy-releases@v1.1.2
        with:
          # 1. 填入原作者的“用户名/仓库名”
          source-repo: "trhhubsd/ARTEX"
          
          # 2. 填入你自己的“用户名/仓库名”
          target-repo: "2026japanlife/ARTEX"
          
          # 3. 保持默认即可，GitHub 自动提供的操作权限令牌
          github-token: ${{ secrets.GITHUB_TOKEN }}
